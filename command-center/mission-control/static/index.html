<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os.css?v=711099d7">
<link rel="stylesheet" href="stark.css?v=69e870f9">
<link rel="stylesheet" href="layout.css?v=ca07792c">
<link rel="stylesheet" href="themes.css?v=755bc1ca">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
<div class="bg-orbs"><i></i><i></i><i></i></div>

<header class="topbar glass">
  <div class="brand"><span class="orb"></span> Mission Control</div>
  <div class="topstats" id="topstats"></div>
</header>

<main id="view"></main>

<nav class="dock glass">
  <div class="dock-h">Main</div>
  <button data-view="home" title="Home">⌂<span>Home</span></button>
  <button data-view="chat" class="active" title="Chat — Hammond">✋<span>Chat</span></button>
  <button data-view="hub" title="Hub — project status board">🗂<span>Hub</span></button>
  <button data-view="projects" title="Projects">⌥<span>Projects</span></button>
  <button data-view="apps" title="Apps">▦<span>Apps</span></button>
  <div class="dock-h">AI</div>
  <button data-view="pipeline" title="Pipeline">⛭<span>Pipeline</span></button>
  <button data-view="swarm" title="Swarm">⬡<span>Swarm</span></button>
  <button data-view="flows" title="Flows">⛓<span>Flows</span></button>
  <button data-view="workflows" title="Workflows">⚡<span>Workflows</span></button>
  <button data-view="compare" title="Compare">⚖️<span>Compare</span></button>
  <button data-view="term" title="Terminal">❯<span>Term</span></button>
  <button data-view="control" title="Control">🎛<span>Control</span></button>
  <div class="dock-h">Content</div>
  <button data-view="agentdrop" title="Agent Drop">⤵<span>Agent Drop</span></button>
  <button data-view="reels" title="Reels Vault">▶<span>Reels</span></button>
  <button data-view="reeltools" title="Reel Tools">🛠<span>Reel Tools</span></button>
  <button data-view="tools" title="Toolbox">⚙<span>Tools</span></button>
  <button data-view="artifacts" title="Artifacts Ring">💍<span>Artifacts</span></button>
  <button data-view="filegraph" title="Understand Anything">🕸<span>FileGraph</span></button>
  <div class="dock-h">Life</div>
  <button data-view="life" title="Life HQ">◎<span>Life HQ</span></button>
  <button data-view="college" title="Road to Fall 2027">🏛<span>College</span></button>
  <button data-view="briefs" title="CEO Briefs">☰<span>Briefs</span></button>
  <button data-view="learn" title="Learn">🎓<span>Learn</span></button>
</nav>

<div id="palette" hidden onclick="if(event.target===this)closePalette()">
  <div class="pal-box glass" role="dialog" aria-label="Command palette">
    <input id="palinput" placeholder="jump to a tab or search reels, goals, flows, briefs…"
      oninput="palInput(this.value)" autocomplete="off" spellcheck="false">
    <div id="palresults"></div>
    <div class="pal-hint">↑↓ navigate · ↵ open · esc close · ⌘K or / anywhere · 1–9 switch tabs</div>
  </div>
</div>

<script src="os.js?v=8f97a3ed"></script>
<script src="hub.js?v=9f6f054e"></script>
<script src="stark.js?v=b6317cd8"></script>
<script src="theme.js?v=f205a04d"></script>
<script src="projects2.js?v=3fc138b1"></script>
<script src="apps2.js?v=14aedfa7"></script>
<script src="home2.js?v=6b96ab0a"></script>
<script src="notes.js?v=fcf05aa5"></script>
</body>
</html>
