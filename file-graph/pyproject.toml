[project]
name = "filegraph"
version = "0.1.0"
description = "Local knowledge graph of your files with semantic search and AI access control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["filegraph"]
