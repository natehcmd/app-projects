name: HandsAI
options:
  bundleIdPrefix: com.natehoward
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  HandsAI:
    type: application
    platform: macOS
    sources:
      - path: HandsAI
        excludes:
          - "Info.plist"
          - "HandsAI.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natehoward.handsai
        PRODUCT_NAME: "Hands AI"
        INFOPLIST_FILE: HandsAI/Info.plist
        CODE_SIGN_ENTITLEMENTS: HandsAI/HandsAI.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
