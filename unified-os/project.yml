name: UnifiedOS
options:
  bundleIdPrefix: com.natehoward
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  UnifiedOS:
    type: application
    platform: macOS
    sources:
      - path: Unified
        excludes:
          - "Info.plist"
          - "Unified.entitlements"
      - path: ../hands-ai-mac/HandsAI
        excludes:
          - "HandsAIApp.swift"
          - "Info.plist"
          - "HandsAI.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natehoward.unifiedos
        PRODUCT_NAME: "Unified OS"
        INFOPLIST_FILE: Unified/Info.plist
        CODE_SIGN_ENTITLEMENTS: Unified/Unified.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
