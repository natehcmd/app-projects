name: AgentDrop
options:
  bundleIdPrefix: com.natehoward
  deploymentTarget:
    macOS: "14.0"
targets:
  AgentDrop:
    type: application
    platform: macOS
    sources: [AgentDrop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natehoward.AgentDrop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.9"
