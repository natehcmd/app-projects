<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claude Browser Agent — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      padding: 32px;
      min-height: 100vh;
      font-size: 14px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #c9a96e;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      max-width: 480px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #a07840; }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    .hint a { color: #c9a96e; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
    button {
      background: #c9a96e;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: #0d0d0d;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #a07840; color: #fff; }
    .saved {
      display: none;
      color: #66aa66;
      font-size: 13px;
      margin-left: 12px;
    }
    .saved.visible { display: inline; }
  </style>
</head>
<body>
  <h1>Claude Browser Agent Settings</h1>

  <div class="form-group">
    <label for="apiKey">Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
    <div class="hint">
      Get your API key from <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>.
      Stored locally in your browser, never sent anywhere except the Anthropic API.
    </div>
  </div>

  <button id="saveBtn">Save</button>
  <span class="saved" id="savedMsg">Saved!</span>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const saveBtn = document.getElementById('saveBtn');
    const savedMsg = document.getElementById('savedMsg');

    chrome.storage.local.get('apiKey', (result) => {
      if (result.apiKey) {
        apiKeyInput.value = result.apiKey;
      }
    });

    saveBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return;
      chrome.storage.local.set({ apiKey: key }, () => {
        savedMsg.classList.add('visible');
        setTimeout(() => savedMsg.classList.remove('visible'), 2000);
      });
    });

    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveBtn.click();
    });
  </script>
</body>
</html>
