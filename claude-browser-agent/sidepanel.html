<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Browser Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a96e' stroke-width='2'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5z'/%3E%3Cpath d='M2 17l10 5 10-5'/%3E%3Cpath d='M2 12l10 5 10-5'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #0d0d0d, 0 0 0 4px #c9a96e;
      border-radius: 6px;
    }

    :root {
      --bg: #0d0d0d;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --text2: #999;
      --accent: #c9a96e;
      --accent2: #a07840;
      --user-bg: #1e2a1e;
      --user-border: #2d4a2d;
      --tool-bg: #1a1a2e;
      --tool-border: #2d2d4a;
      --error: #ff6b6b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--accent);
    }
    .header-title svg { width: 18px; height: 18px; }
    .header-actions {
      display: flex;
      gap: 4px;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      padding: 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--bg3); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text2);
      text-align: center;
      padding: 24px;
    }
    .empty-state svg { width: 40px; height: 40px; opacity: 0.3; }
    .empty-state h3 { font-size: 15px; color: var(--text); font-weight: 500; }
    .empty-state p { font-size: 12px; line-height: 1.6; }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg-label {
      font-size: 11px;
      color: var(--text2);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 2px;
    }
    .msg-bubble {
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
    }
    .msg.assistant .msg-bubble {
      background: var(--bg2);
      border: 1px solid var(--border);
    }
    .msg.error .msg-bubble {
      background: #2a1010;
      border: 1px solid #4a2020;
      color: var(--error);
    }

    /* Tool call pill */
    .tool-call {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      border-radius: 8px;
      font-size: 12px;
      color: #8888cc;
    }
    .tool-call .tool-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .tool-call .tool-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--tool-border);
      border-top-color: #8888cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .tool-call.done { opacity: 0.5; }
    .tool-call.done .tool-spinner { display: none; }
    .tool-call.done .tool-check { display: block; }
    .tool-check { display: none; color: #66aa66; }
    .tool-name { font-family: 'SF Mono', monospace; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: fit-content;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text2);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* Markdown-ish text rendering */
    .msg-text code {
      background: var(--bg3);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
    }
    .msg-text pre {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 4px 0;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
    }
    .msg-text pre code { background: none; padding: 0; }
    .msg-text p { margin: 4px 0; }
    .msg-text ul, .msg-text ol { margin: 4px 0 4px 18px; }
    .msg-text strong { font-weight: 600; }

    /* Input area */
    .input-area {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: var(--accent2); }
    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      min-height: 20px;
      max-height: 120px;
      overflow-y: auto;
    }
    textarea::placeholder { color: var(--text2); }
    textarea::-webkit-scrollbar { width: 3px; }
    textarea::-webkit-scrollbar-thumb { background: var(--border); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #0d0d0d;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }
    .send-btn:hover { background: var(--accent2); color: #fff; }
    .send-btn:disabled { opacity: 0.3; cursor: default; }
    .send-btn svg { width: 14px; height: 14px; }

    .stop-btn {
      background: #3a1818;
      border: 1px solid #5a2020;
      border-radius: 8px;
      cursor: pointer;
      color: var(--error);
      padding: 4px 10px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 5px;
      width: 100%;
      justify-content: center;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .stop-btn:hover { background: #4a2020; }
    .stop-btn.visible { display: flex; }

    .spacer { height: 12px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      Claude
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="clearBtn" title="Clear chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <h3>Claude Browser Agent</h3>
      <p>Ask me to do anything in your browser.<br/>I can navigate, click, fill forms, and more.</p>
    </div>
  </div>
  <div class="spacer"></div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="input"
        placeholder="Ask Claude to do something..."
        rows="1"
      ></textarea>
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <button class="stop-btn" id="stopBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
      Stop
    </button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
